# FastDL-WON: game files and the signed manifest only. Web root built by tools/mkfastdl.sh, which leaves
# exactly the files the manifest lists in a tree. Included in the http{} block of the stock nginx.conf.
# Integrity comes from the signed manifest, not from this server: everything here limits exposure and load.

# Only the client plugin's user agent (any version) gets files. This is NOT a security boundary (the
# header is trivially spoofed); it keeps browsers, crawlers and casual scanners out of the trees.
map $http_user_agent $fastdl_client {
    ~^FastDL-WON/       1;
    default             0;
}
map $uri $fastdl_tree {
    "~^/(?<fdl_tree>[A-Za-z0-9_~-][A-Za-z0-9._~-]{0,31})/" $fdl_tree;
    default                                              -;
}
# docker log (stdout): rejected requests only, so no per-player file lists are kept there
map $status $fastdl_reject {
    ~^(200|206|304)$ 0;
    default          1;
}
# Compact log for the goldsrc dashboard (FastDL flag per player): time, client IP, status, tree, UA.
# Only plugin requests are written (if=$fastdl_client); no file names. Rotated on the host (copytruncate).
log_format fastdl_dash '$msec $remote_addr $status $fastdl_tree "$http_user_agent"';
log_format fastdl_main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
limit_conn_zone $binary_remote_addr zone=fastdl_conn:4m;
limit_req_zone  $binary_remote_addr zone=fastdl_req:4m rate=50r/s;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    # the web root is the only thing visible in the container; inside a tree no symlink is followed
    # (the tree itself is a symlink to its generation directory)
    disable_symlinks on from=$document_root/$fastdl_tree;

    # requests are a short GET without body; anything larger is refused early
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    # the client never sends Range; one range keeps resuming possible without multipart amplification
    max_ranges 1;

    # One plugin uses one keep-alive connection and fetches files one after another; 8 connections and a
    # burst of 200 requests leave room for several players behind one NAT address.
    limit_conn fastdl_conn 8;
    limit_req zone=fastdl_req burst=200 nodelay;
    # Bandwidth: limit_rate is per connection, so one IP gets at most 8 x 2 MB/s (~130 Mbit/s); size both to
    # the uplink the game servers share. The client gives up below 64 KB/s and spends at most 40 s per
    # connection attempt on HTTP: 2 MB/s still fits a 64 MB map into one attempt.
    limit_rate 2m;
    limit_conn_status 429;
    limit_req_status 429;

    types { }
    default_type application/octet-stream;
    charset off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    # the client verifies every file against the manifest; revalidation keeps proxies from serving a
    # stale manifest (or a file of an older generation) after the tree was rebuilt
    add_header Cache-Control "no-cache" always;

    access_log /var/log/nginx/access.log fastdl_main if=$fastdl_reject;
    access_log /var/log/fastdl/access.log fastdl_dash if=$fastdl_client buffer=4k flush=5s;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($fastdl_client = 0) { return 404; }

    # container healthcheck; return runs before allow/deny, hence the if
    location = /healthz { access_log off; if ($remote_addr != 127.0.0.1) { return 404; } return 204; }
    location ~ /\. { return 404; }
    location ~* ^/[^/]+/[^/]+\.wad$ { try_files $uri =404; }
    location ~* ^/[^/]+/maps/[^/]+\.(bsp|res|txt)$ { try_files $uri =404; }
    location ~* ^/[^/]+/(models|sound|media|sprites|gfx)/.+\.(mdl|bmp|wav|mp3|spr|txt|tga)$ { try_files $uri =404; }
    location ~* ^/[^/]+/overviews/[^/]+\.(bmp|tga|txt)$ { try_files $uri =404; }
    location ~ ^/[^/]+/fastdl\.manifest$ { try_files $uri =404; }
    location / { return 404; }
}
